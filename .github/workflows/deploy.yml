name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Node.js syntax
        run: node --check src/server.js

  deploy:
    name: Deploy Backend to EC2
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy Backend to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 10m

          script: |
            set -e

            echo "========================================="
            echo "BACKEND DEPLOYMENT STARTED"
            echo "========================================="

            APP_DIR="/var/www/backend"
            REPO_URL="https://github.com/${{ github.repository }}.git"
            BRANCH="main"

            echo "User: $(whoami)"
            echo "Application directory: $APP_DIR"
            echo "Repository: $REPO_URL"
            echo "Branch: $BRANCH"

            echo "-----------------------------------------"
            echo "Preparing application directory..."
            echo "-----------------------------------------"

            sudo mkdir -p "$APP_DIR"
            sudo chown -R "$USER:$USER" "$APP_DIR"

            cd "$APP_DIR"

            if [ -d ".git" ]; then

              echo "Existing Git repository found."

              echo "Saving .env file..."

              if [ -f ".env" ]; then
                cp ".env" "/tmp/backend-env-backup"
              fi

              echo "Fetching latest code..."

              git fetch origin "$BRANCH"

              git reset --hard "origin/$BRANCH"

              git clean -fd

              echo "Restoring .env..."

              if [ -f "/tmp/backend-env-backup" ]; then
                cp "/tmp/backend-env-backup" ".env"
                rm -f "/tmp/backend-env-backup"
              fi

            else

              echo "Git repository not found."

              echo "Removing old application files..."

              cd /var/www

              sudo rm -rf "$APP_DIR"

              sudo mkdir -p "$APP_DIR"

              sudo chown -R "$USER:$USER" "$APP_DIR"

              echo "Cloning repository..."

              git clone \
                --branch "$BRANCH" \
                --single-branch \
                "$REPO_URL" \
                "$APP_DIR"

              cd "$APP_DIR"

            fi

            echo "-----------------------------------------"
            echo "Checking project files..."
            echo "-----------------------------------------"

            pwd
            ls -la

            if [ ! -f "package.json" ]; then
              echo "ERROR: package.json not found!"
              exit 1
            fi

            echo "package.json found."

            echo "-----------------------------------------"
            echo "Installing production dependencies..."
            echo "-----------------------------------------"

            npm ci --omit=dev

            echo "-----------------------------------------"
            echo "Checking PM2..."
            echo "-----------------------------------------"

            if ! command -v pm2 >/dev/null 2>&1; then
              echo "PM2 is not installed."
              echo "Installing PM2..."

              sudo npm install -g pm2
            fi

            pm2 --version

            echo "-----------------------------------------"
            echo "Starting / restarting backend..."
            echo "-----------------------------------------"

            if [ -f "ecosystem.config.js" ]; then

              echo "ecosystem.config.js found."

              if pm2 describe backend-api >/dev/null 2>&1; then
                echo "Reloading backend-api..."
                pm2 reload ecosystem.config.js --env production
              else
                echo "Starting backend-api..."
                pm2 start ecosystem.config.js --env production
              fi

            else

              echo "ecosystem.config.js not found."

              if pm2 describe backend-api >/dev/null 2>&1; then
                echo "Restarting backend-api..."
                pm2 restart backend-api
              else
                echo "Starting server directly with PM2..."
                pm2 start src/server.js --name backend-api
              fi

            fi

            echo "-----------------------------------------"
            echo "Saving PM2 configuration..."
            echo "-----------------------------------------"

            pm2 save

            echo "-----------------------------------------"
            echo "PM2 process status"
            echo "-----------------------------------------"

            pm2 status

            echo "-----------------------------------------"
            echo "Waiting for backend..."
            echo "-----------------------------------------"

            sleep 5

            echo "-----------------------------------------"
            echo "Health check"
            echo "-----------------------------------------"

            HTTP_STATUS=$(curl -s \
              -o /dev/null \
              -w "%{http_code}" \
              http://localhost:5000/api/health || true)

            echo "HTTP Status: $HTTP_STATUS"

            if [ "$HTTP_STATUS" = "200" ]; then

              echo "SUCCESS: Backend health check passed."

            else

              echo "WARNING: Health check failed."

              echo "-----------------------------------------"
              echo "PM2 status"
              echo "-----------------------------------------"

              pm2 status

              echo "-----------------------------------------"
              echo "PM2 logs"
              echo "-----------------------------------------"

              pm2 logs backend-api --lines 30 --nostream || true

              exit 1

            fi

            echo "========================================="
            echo "BACKEND DEPLOYMENT SUCCESSFUL"
            echo "========================================="

            echo "Deployment time: $(date)"