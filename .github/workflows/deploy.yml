name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: node --check src/server.js

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 10m
          timeout: 30s

          script: |
            set -e

            echo "========================================="
            echo "DEPLOYMENT STARTED"
            echo "Time: $(date)"
            echo "========================================="

            APP_DIR="/home/ec2-user/backend"
            BRANCH="main"

            echo "Application directory: $APP_DIR"

            # Create application directory
            mkdir -p "$APP_DIR"

            # Check required commands
            echo "Checking required software..."

            command -v git
            command -v node
            command -v npm
            command -v pm2

            echo "Software check completed."

            # Move to application directory
            cd "$APP_DIR"

            # Repository URL
            REPO_URL="https://github.com/${{ github.repository }}.git"

            if [ -d "$APP_DIR/.git" ]; then

              echo "Repository already exists."
              echo "Pulling latest changes..."

              git fetch origin "$BRANCH"
              git reset --hard "origin/$BRANCH"
              git clean -fd

            else

              echo "Repository does not exist."
              echo "Cloning repository..."

              # Backup existing environment/config files if they exist
              if [ -f "$APP_DIR/.env" ]; then
                cp "$APP_DIR/.env" /tmp/backend-env-backup
              fi

              if [ -f "$APP_DIR/ecosystem.config.js" ]; then
                cp "$APP_DIR/ecosystem.config.js" /tmp/backend-ecosystem-backup
              fi

              # Clone repository
              git clone \
                --branch "$BRANCH" \
                --single-branch \
                "$REPO_URL" \
                "$APP_DIR"

              cd "$APP_DIR"

              # Restore .env
              if [ -f "/tmp/backend-env-backup" ]; then
                cp /tmp/backend-env-backup "$APP_DIR/.env"
                rm -f /tmp/backend-env-backup
              fi

              # Restore PM2 configuration
              if [ -f "/tmp/backend-ecosystem-backup" ]; then
                cp /tmp/backend-ecosystem-backup "$APP_DIR/ecosystem.config.js"
                rm -f /tmp/backend-ecosystem-backup
              fi

            fi

            echo "Installing production dependencies..."

            cd "$APP_DIR"

            npm ci --omit=dev

            echo "Dependencies installed."

            echo "Checking PM2..."

            pm2 --version

            echo "Restarting application..."

            if pm2 describe backend-api > /dev/null 2>&1; then

              echo "Application already running."
              echo "Reloading PM2..."

              pm2 reload ecosystem.config.js --env production

            else

              echo "Application not running."
              echo "Starting PM2..."

              pm2 start ecosystem.config.js --env production

            fi

            # Save PM2 process list
            pm2 save

            echo "Waiting for application to start..."

            sleep 5

            echo "Checking PM2 status..."

            pm2 status

            echo "Health check..."

            HTTP_STATUS=$(curl \
              -s \
              -o /dev/null \
              -w "%{http_code}" \
              --max-time 10 \
              http://127.0.0.1:5000/api/health || echo "000")

            echo "Health check HTTP status: $HTTP_STATUS"

            if [ "$HTTP_STATUS" = "200" ]; then

              echo "SUCCESS: Health check passed."

            else

              echo "ERROR: Health check failed."
              echo "PM2 status:"
              pm2 status

              echo "Recent PM2 logs:"
              pm2 logs backend-api --lines 30 --nostream

              exit 1

            fi

            echo "========================================="
            echo "DEPLOYMENT SUCCESSFUL"
            echo "Time: $(date)"
            echo "========================================="